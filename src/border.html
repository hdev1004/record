<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    #b {
      position: fixed; inset: 0;
      border: 2px solid #4c8dff;
      transition: border-color 0.25s;
    }
    body.rec #b { border-color: #ff453a; animation: pulse 1.6s ease-in-out infinite; }
    body.flash #b { animation: flash 0.32s ease-in-out 3; }
    @keyframes flash { 50% { border-color: transparent; } }
    @keyframes pulse { 50% { border-color: rgba(255, 69, 58, 0.45); } }
  </style>
</head>
<body>
  <div id="b"></div>
  <script>
    // 테두리 두께 = 4 물리픽셀 (창 크기는 Rust가 영역/모니터 가장자리에 맞춰 잡음)
    const fit = () => (document.getElementById("b").style.borderWidth = 4 / (window.devicePixelRatio || 1) + "px");
    fit();
    window.addEventListener("resize", fit);
    document.getElementById("b").addEventListener("animationend", () => document.body.classList.remove("flash"));
    window.__TAURI__.event.listen("border-state", ({ payload }) => {
      fit();
      document.body.classList.toggle("rec", !!payload.recording);
      if (payload.flash) {
        // 방금 선택한 범위가 어디인지 잠깐 깜빡여서 알려줌
        document.body.classList.remove("flash");
        void document.body.offsetWidth;
        document.body.classList.add("flash");
      }
    });
  </script>
</body>
</html>
